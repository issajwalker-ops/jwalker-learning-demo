<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jwalker Learning</title>
<style>
:root{--blue:#1769e0;--navy:#10284b;--pale:#eef5ff;--bg:#f4f7fb;--ink:#17243a;--muted:#63718a;--line:#dce5f0;--white:#fff;--green:#12805c;--orange:#e88a16}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}button.secondary{background:#e8eef7;color:var(--navy)}button.danger{background:#b42318}button.small{padding:7px 10px;font-size:.88rem}.hidden{display:none!important}.muted{color:var(--muted)}.brand{font-weight:850;letter-spacing:-.5px;font-size:1.25rem;color:var(--navy)}.brand span{color:var(--blue)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top-actions{display:flex;align-items:center;gap:8px}.wrap{max-width:1200px;margin:auto;padding:22px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf2ff,#f8fbff 55%,#dceaff)}.auth-card{background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px #1b3a6514;border-radius:22px;padding:26px;width:min(100%,460px)}h1,h2,h3{line-height:1.2;margin-top:0}h1{font-size:clamp(1.7rem,5vw,2.5rem)}h2{font-size:1.4rem}h3{font-size:1.05rem}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:650;font-size:.92rem}.field input,.field select,.field textarea,input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd7e6;border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:20px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;height:max-content;position:sticky;top:82px}.navbtn{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin:4px 0;font-weight:600}.navbtn.active,.navbtn:hover{background:var(--pale);color:var(--blue)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;min-width:0}.hero{background:linear-gradient(120deg,#10284b,#1769e0);color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}.hero p{color:#e3edff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.subject-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}.subject-card .emoji{font-size:1.7rem}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#eaf2ff;color:#1a5ec4;font-size:.78rem;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.teacher-stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:15px;border-radius:13px;background:#f2f7ff}.stat strong{font-size:1.5rem;display:block}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-title{font-weight:750}.tag{font-size:.8rem;color:var(--muted)}.notice{background:#fff7e6;border:1px solid #f4d28d;border-radius:12px;padding:12px;color:#6b4a0d}.success{background:#e9f8f1;border:1px solid #b7e6d0;padding:10px;border-radius:10px;color:#0b6849}.chat{height:310px;overflow:auto;background:#f7faff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.bubble{max-width:90%;padding:10px 12px;border-radius:12px;margin:7px 0;background:#e6efff;white-space:pre-wrap}.bubble.me{background:#dff5e9;margin-left:auto}.lesson-body{white-space:pre-wrap;line-height:1.65}.footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px}.mobile-nav{display:none}.empty{padding:22px;text-align:center;color:var(--muted)}a{color:var(--blue)}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:5px;padding:8px}.navbtn{white-space:nowrap;width:auto;flex:0 0 auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.panel{padding:16px}}@media(max-width:850px){.teacher-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid,.stats,.teacher-stats{grid-template-columns:1fr}.topbar{padding:12px}.top-actions button{padding:8px}.hero{padding:18px}.auth-card{padding:20px}}
</style>
</head>
<body>
<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="brand">Jwalker <span>Learning</span></div>
    <p class="muted">Jifunze. Fanya mazoezi. Faulu.</p>
    <h1 id="authTitle">Ingia kwenye akaunti</h1>
    <div class="row"><button type="button" class="secondary" id="showLogin">Ingia</button><button type="button" class="secondary" id="showRegister">Tengeneza akaunti</button></div>
    <div class="field hidden" id="nameField"><label>Jina kamili</label><input id="authName" placeholder="Mf. Asha Juma"></div>
    <div class="field"><label>Email au jina la mtumiaji</label><input id="authUser" autocomplete="username" placeholder="jina au email"></div>
    <div class="field"><label>Nenosiri</label><input id="authPass" type="password" autocomplete="current-password" placeholder="Weka nenosiri"></div>
    <div class="field hidden" id="roleField"><label>Aina ya akaunti</label><select id="authRole"><option value="student">Mwanafunzi</option><option value="teacher">Mwalimu</option></select></div><div class="field hidden" id="regFormField"><label>Kidato chako</label><select id="authForm"><option>Form I</option><option>Form II</option><option>Form III</option><option>Form IV</option></select></div>
    <button id="authSubmit" style="width:100%">Ingia</button>
  </div>
</div>
<div id="app" class="hidden">
<header class="topbar"><div class="brand">Jwalker <span>Learning</span></div><div class="top-actions"><span id="userBadge" class="pill">Mwanafunzi</span><button id="langBtn" class="secondary small">English</button><button id="logoutBtn" class="secondary small">Toka</button></div></header>
<div class="wrap">
<div class="hero"><span class="pill">FORM I–IV • TANZANIA</span><h1 id="welcome">Karibu Jwalker Learning</h1><p>Masomo, mazoezi, kazi za nyumbani na darasa la mtandaoni—sehemu moja.</p></div>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main id="main"></main></div>

</div></div>
<script>
const subjects=[
 {id:'math',sw:'Hisabati',en:'Mathematics',icon:'📐',desc:'Namba, aljebra, jiometri na takwimu.'},
 {id:'english',sw:'Kiingereza',en:'English',icon:'📘',desc:'Grammar, reading, writing and vocabulary.'},
 {id:'physics',sw:'Fizikia',en:'Physics',icon:'⚡',desc:'Nguvu, mwendo, nishati na umeme.'},
 {id:'chemistry',sw:'Kemia',en:'Chemistry',icon:'🧪',desc:'Atomi, elementi, mchanganyiko na majaribio.'},
 {id:'biology',sw:'Biolojia',en:'Biology',icon:'🌱',desc:'Viumbe hai, seli, afya na mazingira.'},
 {id:'computer',sw:'Kompyuta',en:'Computer Studies',icon:'💻',desc:'Kompyuta, usalama wa mtandao na coding.'}
];
const lessons=[
 {id:'math1',subject:'math',form:'Form I',title:'Namba kamili / Integers',sw:'Namba kamili ni namba chanya, namba hasi na sifuri. Mfano: −3, −2, −1, 0, 1, 2, 3. Unapojumlisha namba hasi na chanya, tumia alama na ukubwa wa namba.',en:'Integers include positive numbers, negative numbers and zero. Examples: −3, −2, −1, 0, 1, 2, 3. When adding a positive and a negative integer, compare their absolute values and keep the sign of the larger one.'},
 {id:'eng1',subject:'english',form:'Form I',title:'Parts of Speech',sw:'Aina kuu za maneno ni noun (nomino), verb (kitenzi), adjective (kivumishi), adverb (kielezi), pronoun (kiwakilishi), preposition, conjunction na interjection. Mfano: “A clever student reads quickly.”',en:'Parts of speech include nouns, verbs, adjectives, adverbs, pronouns, prepositions, conjunctions and interjections. Example: “A clever student reads quickly.” Clever describes the student; reads is the verb; quickly describes how the student reads.'},
 {id:'phy1',subject:'physics',form:'Form I',title:'Measurement / Upimaji',sw:'Upimaji hulinganisha kiasi na kipimo sanifu. SI units: urefu—metre (m), uzito wa kitu/mass—kilogram (kg), muda—second (s), joto—kelvin (K).',en:'Measurement compares a quantity with a standard unit. SI units include length—metre (m), mass—kilogram (kg), time—second (s), and temperature—kelvin (K).'},
 {id:'chem1',subject:'chemistry',form:'Form I',title:'Matter / Maada',sw:'Maada ni kitu chenye uzito na kinachochukua nafasi. Hali kuu ni yabisi, kimiminika na gesi. Mabadiliko ya hali yanaweza kutokea kwa kuongeza au kupunguza joto.',en:'Matter is anything that has mass and occupies space. The main states are solid, liquid and gas. Heating or cooling can change a substance from one state to another.'},
 {id:'bio1',subject:'biology',form:'Form I',title:'Characteristics of Living Things',sw:'Viumbe hai huonyesha sifa kama lishe, upumuaji, mwitikio, ukuaji, uzazi, utoaji taka na mwendo. Kumbuka: si kila kitu kinachosogea ni kiumbe hai.',en:'Living things show characteristics such as nutrition, respiration, sensitivity, growth, reproduction, excretion and movement. Not everything that moves is alive.'},
 {id:'comp1',subject:'computer',form:'Form I',title:'Computer Basics',sw:'Kompyuta hupokea data (input), huichakata (processing), hutoa taarifa (output) na inaweza kuhifadhi matokeo (storage). Mfano wa input: keyboard; output: monitor; storage: flash disk.',en:'A computer accepts data (input), processes it, produces information (output), and can store results (storage). Examples: keyboard—input; monitor—output; flash drive—storage.'},
 {id:'math2',subject:'math',form:'Form II',title:'Algebra: Simple Equations',sw:'Mfano: 2x + 4 = 10. Toa 4 pande zote: 2x = 6. Gawanya kwa 2: x = 3. Kumbuka kufanya operesheni ileile pande zote mbili.',en:'Example: 2x + 4 = 10. Subtract 4 from both sides: 2x = 6. Divide both sides by 2: x = 3. Always perform the same operation on both sides.'},
 {id:'bio3',subject:'biology',form:'Form III',title:'Cell Structure',sw:'Seli ni kitengo cha msingi cha uhai. Sehemu muhimu: utando wa seli, saitoplazimu na kiini. Seli za mimea huwa na ukuta wa seli na kloroplasti ambazo hazipo kwenye seli za wanyama kwa namna hiyo.',en:'The cell is the basic unit of life. Important parts include the cell membrane, cytoplasm and nucleus. Plant cells also have a cell wall and chloroplasts, unlike typical animal cells.'},
 {id:'comp4',subject:'computer',form:'Form IV',title:'Cyber Safety',sw:'Tumia nenosiri refu na la kipekee, washa uthibitishaji wa hatua mbili, usifungue viambatisho usivyotarajia, na usishiriki taarifa binafsi na watu usiowajua.',en:'Use long, unique passwords, enable two-factor authentication, avoid unexpected attachments, and do not share personal information with strangers.'}
];
const quizBank=[
 {subject:'math',form:'Form I',q:'−2 + 5 = ?',opts:['−7','3','7'],a:1,why:'Ukianzia −2 na kuongeza 5 unapata 3.'},
 {subject:'english',form:'Form I',q:'Which word is a verb in “Asha runs fast”?',opts:['Asha','runs','fast'],a:1,why:'“Runs” shows the action.'},
 {subject:'physics',form:'Form I',q:'SI unit ya muda ni ipi?',opts:['Metre','Second','Kilogram'],a:1,why:'Muda hupimwa kwa second (s).'},
 {subject:'chemistry',form:'Form I',q:'Ni hali ipi ya maada yenye umbo lisilobadilika?',opts:['Gesi','Kimiminika','Yabisi'],a:2,why:'Yabisi huhifadhi umbo lake.'},
 {subject:'biology',form:'Form I',q:'Kitengo cha msingi cha uhai ni kipi?',opts:['Seli','Kiungo','Mfumo'],a:0,why:'Seli ndiyo basic unit of life.'},
 {subject:'computer',form:'Form I',q:'Keyboard ni kifaa cha aina gani?',opts:['Output','Input','Storage'],a:1,why:'Keyboard hutumika kuingiza data.'}
];
const KEY='jwalkerLearning_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"users":[],"assignments":[],"notes":[],"classes":[],"progress":{},"chat":[]}');
let current=null,lang='sw',page='home',selectedForm='Form I',selectedSubject='math',lessonOpen=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tr(sw,en){return lang==='sw'?sw:en}
function subjectName(s){return lang==='sw'?s.sw:s.en}
function roleName(r){return r==='teacher'?'Mwalimu':'Mwanafunzi'}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function signIn(user,role,name){let savedUser=db.users.find(u=>u.user===user);current={user,role,name,form:savedUser?.form||'Form I'};if(role==='teacher'){let migrated=false;(db.assignments||[]).forEach(a=>{if(!a.ownerUser&&a.teacher===name){a.ownerUser=user;migrated=true}});if(migrated)save()}localStorage.setItem('jwalkerSession',JSON.stringify(current));document.getElementById('authScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userBadge').textContent=roleName(role);document.getElementById('welcome').textContent=tr('Karibu, ','Welcome, ')+name;render()}
let authMode='login';
function setAuthMode(mode){authMode=mode;document.getElementById('authTitle').textContent=mode==='register'?'Tengeneza akaunti mpya':'Ingia kwenye akaunti';document.getElementById('authSubmit').textContent=mode==='register'?'Jisajili':'Ingia';document.getElementById('nameField').classList.toggle('hidden',mode!=='register');document.getElementById('roleField').classList.toggle('hidden',mode!=='register');document.getElementById('regFormField').classList.toggle('hidden',mode!=='register');document.getElementById('authPass').autocomplete=mode==='register'?'new-password':'current-password'}
document.getElementById('showLogin').onclick=()=>setAuthMode('login');
document.getElementById('showRegister').onclick=()=>setAuthMode('register');
function registerOrLogin(){let name=document.getElementById('authName').value.trim(),user=document.getElementById('authUser').value.trim().toLowerCase(),pass=document.getElementById('authPass').value,role=document.getElementById('authRole').value;if(!user||!pass){alert('Jaza username/email na nenosiri.');return}let found=db.users.find(u=>u.user===user);if(authMode==='register'){if(!name){alert('Jaza jina kamili.');return}if(found){alert('Akaunti hii tayari ipo. Ingia badala yake.');setAuthMode('login');return}if(pass.length<4){alert('Nenosiri liwe na angalau herufi/namba 4.');return}let u={name,user,pass,role,form:role==='student'?document.getElementById('authForm').value:'Form I'};db.users.push(u);save();signIn(user,role,name)}else{if(!found){alert('Akaunti haipo. Tafadhali tengeneza akaunti kwanza.');return}if(found.pass!==pass){alert('Nenosiri si sahihi.');return}signIn(found.user,found.role,found.name)}}
document.getElementById('authSubmit').onclick=registerOrLogin;
document.getElementById('logoutBtn').onclick=()=>{current=null;localStorage.removeItem('jwalkerSession');document.getElementById('app').classList.add('hidden');document.getElementById('authScreen').classList.remove('hidden')};
document.getElementById('langBtn').onclick=()=>{lang=lang==='sw'?'en':'sw';document.getElementById('langBtn').textContent=lang==='sw'?'English':'Kiswahili';render()};
const nav=[['home','🏠','Nyumbani','Home'],['subjects','📚','Masomo','Subjects'],['classes','🎥','Online classes','Online classes'],['assignments','📝','Kazi za nyumbani','Assignments'],['notes','📒','Notes za mwalimu','Teacher notes'],['ai','🤖','Jwalker AI','Jwalker AI'],['dashboard','📊','Dashboard','Dashboard']];
function renderNav(){let visibleNav=nav.filter(n=>current.role==='teacher'||n[0]!=='notes');document.getElementById('sidebar').innerHTML=visibleNav.map(n=>`<button class="navbtn ${page===n[0]?'active':''}" data-page="${n[0]}">${n[1]} ${tr(n[2],n[3])}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()}); }
function render(){renderNav();let main=document.getElementById('main');if(page==='home')main.innerHTML=homePage();else if(page==='subjects')main.innerHTML=subjectsPage();else if(page==='classes')main.innerHTML=classesPage();else if(page==='assignments')main.innerHTML=assignmentsPage();else if(page==='notes')main.innerHTML=notesPage();else if(page==='ai')main.innerHTML=aiPage();else if(page==='dashboard')main.innerHTML=dashboardPage();bindPage()}
function homePage(){let submitted=db.assignments.filter(a=>a.student===current.user).length;return `<div class="panel"><h2>${tr('Jifunze kwa mpangilio','Learn with a plan')}</h2><p class="muted">${tr('Chagua kidato, fungua somo, jibu quiz na fuatilia maendeleo yako.','Choose a form, open a lesson, take quizzes and track progress.')}</p><div class="stats"><div class="stat"><strong>4</strong>Vidato</div><div class="stat"><strong>6</strong>Masomo</div><div class="stat"><strong>${submitted}</strong>${tr('Kazi ulizowasilisha','Assignments submitted')}</div></div></div><div class="panel"><h2>${tr('Chagua kidato','Choose your form')}</h2><div class="row">${['Form I','Form II','Form III','Form IV'].map(f=>`<button class="${selectedForm===f?'':'secondary'}" data-form="${f}">${f}</button>`).join('')}</div><p class="muted">${tr('Kidato kilichochaguliwa: ','Selected form: ')}<b>${selectedForm}</b></p></div><div class="panel"><h2>${tr('Masomo maarufu','Subjects')}</h2><div class="grid">${subjects.map(s=>`<div class="subject-card"><div class="emoji">${s.icon}</div><h3>${subjectName(s)}</h3><p class="muted">${s.desc}</p><button data-subject="${s.id}" class="small">${tr('Fungua somo','Open subject')}</button></div>`).join('')}</div></div><div class="panel"><h2>${tr('Endelea kujifunza','Continue learning')}</h2>${lessons.filter(l=>l.form===selectedForm).slice(0,3).map(l=>lessonItem(l)).join('')||'<p class="muted">Masomo mapya yanaongezwa.</p>'}</div><div class="panel"><h2>📒 Notes mpya za kidato chako</h2>${db.notes.filter(n=>n.form===selectedForm).slice().reverse().map(n=>`<div class="item"><div class="item-title">${esc(n.title)}</div><div class="tag">${n.form} • ${subjectName(subjects.find(s=>s.id===n.subject)||subjects[0])} • ${esc(n.teacher)}</div>${n.body?`<p>${esc(n.body)}</p>`:''}${n.fileData?`<p><a href="${n.fileData}" download="${esc(n.fileName||'notes')}">📎 Fungua / pakua ${esc(n.fileName||'faili la notes')}</a></p>`:''}<button class="secondary small" data-open-notes-subject="${n.subject}">Fungua somo hili</button></div>`).join('')||'<p class="muted">Bado hakuna notes kwa kidato hiki.</p>'}</div>`}
function subjectsPage(){return `<div class="panel"><h2>${tr('Masomo na vidato','Subjects and forms')}</h2><div class="field"><label>${tr('Chagua kidato','Choose form')}</label><select id="formSelect">${['Form I','Form II','Form III','Form IV'].map(f=>`<option ${selectedForm===f?'selected':''}>${f}</option>`).join('')}</select></div><div class="grid">${subjects.map(s=>`<div class="subject-card"><div class="emoji">${s.icon}</div><h3>${subjectName(s)}</h3><p class="muted">${s.desc}</p><button data-subject="${s.id}">${tr('Fungua masomo','Open lessons')}</button></div>`).join('')}</div><div id="lessonList" class="panel hidden" style="margin-top:18px"></div><div id="classNotes" class="panel" style="margin-top:18px"><h2>📒 Notes za kidato na somo</h2><p class="muted">Chagua kidato na bonyeza “Fungua masomo” kwenye somo husika ili kuona notes zake.</p></div></div>`}
function lessonItem(l){let s=subjects.find(x=>x.id===l.subject);return `<div class="item"><div class="item-title">${s.icon} ${esc(l.title)}</div><div class="tag">${subjectName(s)} • ${l.form}</div><button class="secondary small" data-lesson="${l.id}" style="margin-top:8px">${tr('Soma notes','Read notes')}</button></div>`}
function showSubject(sid){selectedSubject=sid;let target=document.getElementById('lessonList');if(!target){page='subjects';render();target=document.getElementById('lessonList')}target.classList.remove('hidden');let ls=lessons.filter(l=>l.subject===sid&&l.form===selectedForm);let uploaded=db.notes.filter(n=>n.subject===sid&&n.form===selectedForm);let practice=current.role==='student'?`<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="panel"><h3>🧠 Jipime kwa maswali yanayotokana na notes</h3><p class="muted">Mfumo utachanganya maswali kutoka notes za mwalimu na somo la mfumo kwa kidato hiki. Unaweza kuanzisha jaribio jipya mara nyingi; mpangilio na maneno yanayoulizwa hubadilika.</p><div class="row"><div class="field"><label>Idadi ya maswali</label><select id="practiceCount"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></div><div class="field" style="align-self:end"><button id="generatePractice" data-generate-practice data-practice-subject="${sid}">Tengeneza maswali na anza kujipima</button></div></div><p class="tag">Kumbuka: maswali hutengenezwa kwa kanuni kutokana na maandishi. Faili za PDF/DOC/picha haziwezi kusomwa moja kwa moja; mwalimu anapaswa kubandika maandishi ya notes.</p></div>`:'';target.innerHTML=`<h2>${subjectName(subjects.find(s=>s.id===sid))} — ${selectedForm}</h2><h3>Masomo ya mfumo</h3>${ls.length?ls.map(lessonItem).join(''):'<p class="muted">Bado hakuna somo la mfano la kidato hiki.</p>'}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>📒 Notes zilizoongezwa na mwalimu</h3>${uploaded.length?uploaded.slice().reverse().map(n=>`<div class="item"><div class="item-title">${esc(n.title)}</div><div class="tag">${n.form} • ${subjectName(subjects.find(s=>s.id===n.subject)||subjects[0])} • ${esc(n.teacher)}</div>${n.body?`<p class="lesson-body">${esc(n.body)}</p>`:''}${n.fileData?`<p><a href="${n.fileData}" download="${esc(n.fileName||'notes')}">📎 Fungua / pakua ${esc(n.fileName||'faili la notes')}</a></p>`:''}</div>`).join(''):'<p class="muted">Bado hakuna notes za mwalimu kwa somo na kidato hiki.</p>'}${practice}`;bindPage()}

function generateQuestions(text,count){if(!text)return [];let clean=String(text).replace(/\s+/g,' ').replace(/[•●▪]/g,' ');let sentences=clean.split(/[.!?。;\n]+/).map(x=>x.trim()).filter(x=>x.length>18);let allWords=[...new Set((clean.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9-]{2,}/g)||[]).filter(w=>!(/^(the|and|for|with|that|this|from|into|which|when|where|have|has|are|was|were|kwa|katika|hiyo|hili|hizi|huo|kuwa|kama|niyo|nao|ndio|bila|zaidi|kisha|lakini|baada|chini|juu|sana|yake|wake|wao|hapa|huko)$/i.test(w))))];let pool=[];let seen=new Set();for(let sentence of sentences){let words=[...sentence.matchAll(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9-]{3,}/g)].map(m=>({w:m[0],i:m.index})).filter(x=>!(/^(this|that|with|from|into|which|when|where|have|has|were|they|their|then|than|kwaa|hiyo|hili|hizi|huo|kuwa|kama|bila|baada|chini|juu|sana|yake|wake|wao|hapa|huko)$/i.test(x.w)));if(words.length<3)continue;let candidateIndexes=[Math.floor(words.length/2),Math.floor(words.length/3),Math.floor(words.length*2/3),0,words.length-1];for(let idx of candidateIndexes){let item=words[idx];if(!item)continue;let answer=item.w.replace(/[^A-Za-zÀ-ÿ0-9-]/g,'');if(answer.length<3)continue;let blank=sentence.slice(0,item.i)+'________'+sentence.slice(item.i+item.w.length);let distractors=allWords.filter(w=>w.toLowerCase()!==answer.toLowerCase()&&w.length>=3);for(let k=distractors.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[distractors[k],distractors[j]]=[distractors[j],distractors[k]]}let opts=[answer,...distractors.slice(0,5)];opts=[...new Map(opts.map(o=>[o.toLowerCase(),o])).values()].slice(0,4);if(opts.length<3){for(let filler of ['None of these','Not stated']){if(opts.length<3)opts.push(filler)}}for(let k=opts.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]]}let q={q:'Jaza nafasi: '+blank,opts,a:opts.findIndex(o=>o.toLowerCase()===answer.toLowerCase())};let key=q.q.toLowerCase();if(q.a>=0&&!seen.has(key)){seen.add(key);pool.push(q)}}}for(let k=pool.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}return pool}
